<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Mixer</title>
  <style>body{font:16px system-ui;margin:0;background:#f2f5fa;color:#17243a}header{padding:22px;background:#142c4a;color:white}header h1{margin:0;font:inherit}
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;padding:24px}section{background:white;border-radius:12px;padding:24px;min-width:0;overflow-wrap:anywhere}
  #page-nav ul{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:8px 16px}#page-nav a[aria-current]{font-weight:700;color:#17243a;text-decoration:none}
  #pages section{margin:12px 0;border:1px solid #c5cfdf}#pages label{display:block;margin:12px 0}#pages label>span{display:block;margin-bottom:6px;font-weight:600}
  #pages input,#pages textarea{width:100%;box-sizing:border-box}input{padding:10px}@media(max-width:700px){main{grid-template-columns:minmax(0,1fr)}}</style><header><h1>App Mixer</h1></header><main>
  <section><h2>Conversation</h2><p id="chat-status" role="status">Checking agent…</p><div id="chat-log" aria-live="polite"></div><form id="chat-form"><label for="chat-input">Message</label>
  <input id="chat-input" placeholder="Ask agent" disabled><button id="chat-send" type="submit" disabled>Send</button></form></section><section><h2>Workspace</h2>
  <button id="refresh-publication" hidden>Refresh publication</button><p id="publication-status" role="status"></p><nav id="page-nav" aria-label="Pages" hidden></nav><div id="pages"></div></section>
  </main><script type="module">
import { A2UIRenderer, APP_MIXER_CATALOG, ClientPublishedCache } from '/renderer.mjs';
import { prepareWorkspace } from '/workspace.mjs';
import { createOfflinePublicationRuntime } from '/offline-publication-runtime.mjs';
import { initializeOfflinePublication } from '/offline-publication-host.mjs';
const host = document.getElementById('pages');
let cache,
  offlineRuntime,
  renderGeneration = 0,
  shown = false,
  view;
const win = document.defaultView,
  nav = document.getElementById('page-nav');
const showPage = (state) => {
  const route = win?.location.hash.slice(1) || '/',
    page = state.pages.find((item) => item.route === route) ?? state.pages[0];
  state.renderer.apply({
    version: 'v0.9.1',
    updateComponents: { surfaceId: 'workspace', components: [{ ...state.components[0], children: page ? page.ids : [] }, ...state.components.slice(1)] },
  });
  if (nav) {
    const list = document.createElement('ul');
    for (const item of state.pages) {
      const entry = document.createElement('li'),
        link = document.createElement('a');
      link.href = '#' + item.route;
      link.textContent = item.title;
      if (item === page) link.setAttribute('aria-current', 'page');
      entry.appendChild(link);
      list.appendChild(entry);
    }
    nav.replaceChildren(list);
    nav.hidden = state.pages.length < 2;
  }
};
win?.addEventListener('hashchange', () => {
  if (!view) return;
  try {
    showPage(view);
  } catch (error) {
    document.getElementById('publication-status').textContent = 'The page could not be shown: ' + error.message;
  }
});
const render = async () => {
  const generation = ++renderGeneration;
  let previous = [],
    fetched = false;
  try {
    let app;
    if (offlineRuntime) {
      const result = await offlineRuntime.refresh();
      if (generation !== renderGeneration) return;
      app = result.publication.definition;
      document.getElementById('publication-status').textContent = result.offline ? 'Showing saved offline publication.' : '';
    } else if (cache) app = (await cache.refresh()).definition;
    else {
      const response = await fetch('/api/application');
      if (!response.ok) throw new Error('Could not load application');
      app = await response.json();
    }
    fetched = true;
    previous = [...host.children];
    host.replaceChildren();
    const { registry, components, pages } = prepareWorkspace(app);
    const renderer = new A2UIRenderer(host, registry);
    renderer.apply({ version: 'v0.9.1', createSurface: { surfaceId: 'workspace', catalogId: APP_MIXER_CATALOG } });
    const next = { renderer, components, pages };
    showPage(next);
    view = next;
    shown = true;
    {
      const note = document.getElementById('publication-status');
      if (note.textContent.startsWith('The new version was not applied')) note.textContent = '';
    }
  } catch (error) {
    if (generation === renderGeneration) {
      if (shown && fetched) {
        if (previous.length) host.replaceChildren(...previous);
        document.getElementById('publication-status').textContent = 'The new version was not applied: ' + error.message;
      } else {
        document.getElementById('publication-status').textContent = '';
        shown = false;
        host.textContent = 'Unable to render application: ' + error.message;
      }
    }
  }
};
try {
  const offlineOptions = await initializeOfflinePublication();
  if (offlineOptions) {
    if (offlineOptions.scope?.applicationId !== __APP_ID__ || ![1, 2].includes(offlineOptions.scope?.schemaVersion) || typeof offlineOptions.onReady !== 'function')
      throw Error('Invalid offline publication host');
    offlineRuntime = await createOfflinePublicationRuntime({
      ...offlineOptions,
      compatible: (definition) => {
        try {
          prepareWorkspace(definition);
          return true;
        } catch {
          return false;
        }
      },
    });
    const button = document.getElementById('refresh-publication');
    button.hidden = false;
    button.addEventListener('click', () => render());
    const clearDisplay = () => {
      renderGeneration++;
      view = undefined;
      if (nav) {
        nav.replaceChildren();
        nav.hidden = true;
      }
      document.getElementById('publication-status').textContent = '';
      host.replaceChildren();
    };
    offlineOptions.onReady({
      lock() {
        clearDisplay();
        offlineRuntime.close();
        button.hidden = true;
      },
      async clear() {
        clearDisplay();
        await offlineRuntime.clear();
      },
      hasPendingRollbackAnchor() {
        return offlineRuntime.hasPendingRollbackAnchor();
      },
      async syncRollbackAnchor() {
        return offlineRuntime.syncRollbackAnchor();
      },
    });
  } else {
    const state = await (await fetch('/api/publication/status')).json();
    if (state.configured) {
      if (![1, 2].includes(state.schemaVersion)) throw Error('Invalid publication schema version');
      cache = new ClientPublishedCache(
        { tenantId: 'local', authorizationKey: 'local', applicationId: __APP_ID__, schemaVersion: state.schemaVersion },
        async (etag) => {
          const response = await fetch('/api/publication', { headers: etag ? { 'If-None-Match': etag } : {}, cache: 'no-store' });
          if (response.status === 304) return { status: 304 };
          if (!response.ok) throw Error('Publication unavailable');
          return { status: 200, etag: response.headers.get('etag'), publication: await response.json() };
        },
        (definition) => {
          try {
            prepareWorkspace(definition);
            return true;
          } catch {
            return false;
          }
        },
      );
      const button = document.getElementById('refresh-publication');
      button.hidden = false;
      button.addEventListener('click', () => render());
    }
  }
  await render();
} catch (error) {
  host.textContent = 'Unable to render application: ' + error.message;
}
</script><script type="module" src="/chat.mjs"></script></html>
