name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13.0', 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Docker Compose outage smoke test
        if: matrix.node == '22'
        run: node deploy/local/compose-smoke.mjs
      - name: Browser smoke test
        run: node .github/scripts/browser-smoke.mjs
