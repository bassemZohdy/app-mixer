name: Kubernetes Data Plane
on:
  pull_request:
    paths:
      - 'Dockerfile.data-plane'
      - '.dockerignore'
      - 'deploy/kubernetes/**'
      - 'packages/core/**'
      - 'packages/web/**'
      - 'package*.json'
      - 'tsconfig.base.json'
      - '.github/workflows/kubernetes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kind-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Build release signer
        run: npm ci && npm run build
      - name: Install verified kind
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          echo '517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  '"$RUNNER_TEMP/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Start cluster and load image
        run: |
          kind create cluster --name app-mixer
          docker build -f Dockerfile.data-plane -t app-mixer-data-plane:test .
          kind load docker-image app-mixer-data-plane:test --name app-mixer
      - name: Verify rollout, replacement and pod recovery
        run: |
          set -eu
          kubectl create namespace app-mixer-test
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 -subj /CN=app-mixer-revocations -addext subjectAltName=DNS:app-mixer-revocations -keyout "$RUNNER_TEMP/db.key" -out "$RUNNER_TEMP/db.crt" >/dev/null 2>&1
          kubectl create secret tls -n app-mixer-test app-mixer-test-postgres-tls --cert="$RUNNER_TEMP/db.crt" --key="$RUNNER_TEMP/db.key"
          kubectl create secret generic -n app-mixer-test app-mixer-test-postgres --from-literal=password=ci-only-password
          kubectl create secret generic -n app-mixer-test app-mixer-revocation-connection --from-literal=dsn=postgresql://postgres:ci-only-password@app-mixer-revocations:5432/postgres
          kubectl create configmap -n app-mixer-test app-mixer-revocation-ca --from-file=ca.pem="$RUNNER_TEMP/db.crt"
          kubectl apply -n app-mixer-test -f deploy/kubernetes/test-support/postgres.yaml
          provision_db() {
            kubectl rollout status -n app-mixer-test deployment/app-mixer-revocations --timeout=120s
            kubectl exec -n app-mixer-test deployment/app-mixer-revocations -- psql -U postgres -d postgres -c 'CREATE TABLE app_mixer_jwt_revocations (issuer TEXT NOT NULL, token_hash TEXT NOT NULL, retain_until BIGINT NOT NULL, PRIMARY KEY (issuer,token_hash))'
            HASH=$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update("revoked-token").digest("hex"))')
            kubectl exec -n app-mixer-test deployment/app-mixer-revocations -- psql -U postgres -d postgres -c "INSERT INTO app_mixer_jwt_revocations VALUES ('https://issuer.example/','$HASH',4102444800000)"
          }
          provision_db
          kubectl create secret tls -n app-mixer-test app-mixer-data-plane-tls --cert=packages/core/test/fixtures/capability-tls/server-cert.pem --key=packages/core/test/fixtures/capability-tls/server-key.pem
          node -e 'const {generateKeyPairSync}=require("node:crypto"),fs=require("node:fs"),k=generateKeyPairSync("ed25519");fs.writeFileSync(process.env.RUNNER_TEMP+"/private.pem",k.privateKey.export({type:"pkcs8",format:"pem"}));fs.writeFileSync(process.env.RUNNER_TEMP+"/keys.json",JSON.stringify([{keyId:"ci",publicKey:k.publicKey.export({type:"spki",format:"pem"})}]))'
          kubectl create configmap -n app-mixer-test app-mixer-release-keys --from-file=keys.json="$RUNNER_TEMP/keys.json"
          node --input-type=module -e 'import {generateKeyPairSync} from "node:crypto";import {writeFileSync} from "node:fs";import {SignJWT} from "jose";const k=generateKeyPairSync("rsa",{modulusLength:2048}),now=Math.floor(Date.now()/1000),base={iss:"https://issuer.example/",aud:"app-mixer-data-plane",sub:"ci-user",client_id:"ci-client",jti:"ci-token",iat:now,exp:now+600,tenant_id:"demo-tenant",scope:"app-mixer:publication.read"},make=async extra=>new SignJWT({...base,...extra}).setProtectedHeader({alg:"RS256",typ:"at+jwt",kid:"ci"}).sign(k.privateKey);writeFileSync(process.env.RUNNER_TEMP+"/jwks.json",JSON.stringify({keys:[{...k.publicKey.export({format:"jwk"}),kid:"ci",alg:"RS256",use:"sig"}]}));writeFileSync(process.env.RUNNER_TEMP+"/token",await make({}));writeFileSync(process.env.RUNNER_TEMP+"/wrong-tenant-token",await make({tenant_id:"other"}));writeFileSync(process.env.RUNNER_TEMP+"/revoked-token",await make({jti:"revoked-token"}));'
          kubectl create configmap -n app-mixer-test app-mixer-jwt-keys --from-file=jwks.json="$RUNNER_TEMP/jwks.json"
          cp deploy/kubernetes/data-plane/publication.json "$RUNNER_TEMP/unsigned.json"
          node deploy/kubernetes/sign-publication.mjs "$RUNNER_TEMP/unsigned.json" "$RUNNER_TEMP/signed.json" "$RUNNER_TEMP/private.pem" ci production
          cp "$RUNNER_TEMP/signed.json" deploy/kubernetes/data-plane/publication.json
          kubectl apply -n app-mixer-test -k deploy/kubernetes/signed-jwt-tls-revocation-example
          kubectl rollout status -n app-mixer-test deployment/app-mixer-data-plane --timeout=180s
          kubectl wait -n app-mixer-test --for=condition=Ready pods -l app.kubernetes.io/component=data-plane --timeout=90s
          kubectl port-forward -n app-mixer-test service/app-mixer-data-plane 13002:3002 >"$RUNNER_TEMP/forward.log" 2>&1 &
          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -fsS https://127.0.0.1:13002/health/ready && break || sleep 1; done
          if curl -fsS --cacert packages/core/test/fixtures/capability-tls/rogue-cert.pem https://127.0.0.1:13002/health/live; then exit 1; fi
          [ "$(curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -s -o /dev/null -w '%{http_code}' https://127.0.0.1:13002/application)" = 403 ]
          [ "$(curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $(cat "$RUNNER_TEMP/wrong-tenant-token")" https://127.0.0.1:13002/application)" = 403 ]
          curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -fsS -H "Authorization: Bearer $(cat "$RUNNER_TEMP/token")" https://127.0.0.1:13002/application | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(JSON.parse(s).version!==1)process.exit(1)})'
          [ "$(curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $(cat "$RUNNER_TEMP/revoked-token")" https://127.0.0.1:13002/application)" = 403 ]
          kubectl scale -n app-mixer-test deployment/app-mixer-revocations --replicas=0
          kubectl rollout status -n app-mixer-test deployment/app-mixer-revocations --timeout=120s
          for i in $(seq 1 30); do [ "$(curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -s -o /dev/null -w '%{http_code}' https://127.0.0.1:13002/health/ready)" = 503 ] && break || sleep 1; done
          [ "$(curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -s -o /dev/null -w '%{http_code}' https://127.0.0.1:13002/health/ready)" = 503 ]
          [ "$(curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $(cat "$RUNNER_TEMP/token")" https://127.0.0.1:13002/application)" = 403 ]
          kubectl scale -n app-mixer-test deployment/app-mixer-revocations --replicas=1
          provision_db
          for i in $(seq 1 45); do curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -fsS https://127.0.0.1:13002/health/ready && break || sleep 1; done
          curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -fsS -H "Authorization: Bearer $(cat "$RUNNER_TEMP/token")" https://127.0.0.1:13002/application >/dev/null
          node -e 'const fs=require("node:fs"),p="deploy/kubernetes/data-plane/publication.json",x=JSON.parse(fs.readFileSync(p));x.publication.version=99;fs.writeFileSync(p,JSON.stringify(x))'
          kubectl apply -n app-mixer-test -k deploy/kubernetes/signed-jwt-tls-revocation-example
          FOUND=0
          for i in $(seq 1 45); do if kubectl logs -n app-mixer-test -l app.kubernetes.io/component=data-plane --all-containers --prefix --max-log-requests=10 2>&1 | grep -q 'Invalid signed publication'; then FOUND=1; break; fi; sleep 1; done
          [ "$FOUND" = 1 ]
          [ "$(kubectl get deployment -n app-mixer-test app-mixer-data-plane -o jsonpath='{.status.availableReplicas}')" = 2 ]
          printf '%s\n' '{"version":2,"definition":{"id":"demo","schemaVersion":1,"revision":1,"pages":[]}}' > "$RUNNER_TEMP/unsigned2.json"
          node deploy/kubernetes/sign-publication.mjs "$RUNNER_TEMP/unsigned2.json" "$RUNNER_TEMP/signed2.json" "$RUNNER_TEMP/private.pem" ci production
          cp "$RUNNER_TEMP/signed2.json" deploy/kubernetes/data-plane/publication.json
          kubectl apply -n app-mixer-test -k deploy/kubernetes/signed-jwt-tls-revocation-example
          kubectl rollout status -n app-mixer-test deployment/app-mixer-data-plane --timeout=180s
          kill "$FORWARD_PID" 2>/dev/null || true
          kubectl port-forward -n app-mixer-test service/app-mixer-data-plane 13003:3002 >"$RUNNER_TEMP/forward2.log" 2>&1 &
          FORWARD_PID=$!
          for i in $(seq 1 30); do curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -fsS https://127.0.0.1:13003/health/ready && break || sleep 1; done
          curl --cacert packages/core/test/fixtures/capability-tls/ca-cert.pem -fsS -H "Authorization: Bearer $(cat "$RUNNER_TEMP/token")" https://127.0.0.1:13003/application | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(JSON.parse(s).version!==2)process.exit(1)})'
          POD=$(kubectl get pods -n app-mixer-test -l app.kubernetes.io/component=data-plane -o json | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const p=JSON.parse(s).items.find(x=>!x.metadata.deletionTimestamp&&x.status.phase==="Running");if(!p)process.exit(1);console.log(p.metadata.name)})')
          kubectl delete pod -n app-mixer-test "$POD" --wait=true
          kubectl rollout status -n app-mixer-test deployment/app-mixer-data-plane --timeout=180s
          kubectl wait -n app-mixer-test --for=condition=Ready pods -l app.kubernetes.io/component=data-plane --timeout=90s
          for i in $(seq 1 60); do [ "$(kubectl get deployment -n app-mixer-test app-mixer-data-plane -o jsonpath='{.status.readyReplicas}')" = 2 ] && break || sleep 1; done
          [ "$(kubectl get deployment -n app-mixer-test app-mixer-data-plane -o jsonpath='{.status.readyReplicas}')" = 2 ]
          kubectl get -n app-mixer-test deployment,service,pdb,networkpolicy
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n app-mixer-test -o wide || true
          kubectl describe pods -n app-mixer-test || true
          kubectl logs -n app-mixer-test -l app.kubernetes.io/component=data-plane --all-containers --prefix || true
