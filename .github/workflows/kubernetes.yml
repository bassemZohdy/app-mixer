name: Kubernetes Data Plane
on:
  pull_request:
    paths:
      - 'Dockerfile.data-plane'
      - '.dockerignore'
      - 'deploy/kubernetes/**'
      - 'packages/core/**'
      - 'packages/web/**'
      - 'package*.json'
      - 'tsconfig.base.json'
      - '.github/workflows/kubernetes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kind-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install verified kind
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          echo '517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  '"$RUNNER_TEMP/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Start cluster and load image
        run: |
          kind create cluster --name app-mixer
          docker build -f Dockerfile.data-plane -t app-mixer-data-plane:test .
          kind load docker-image app-mixer-data-plane:test --name app-mixer
      - name: Verify rollout, replacement and pod recovery
        run: |
          set -eu
          kubectl create namespace app-mixer-test
          kubectl apply -n app-mixer-test -k deploy/kubernetes/data-plane
          kubectl rollout status -n app-mixer-test deployment/app-mixer-data-plane --timeout=180s
          kubectl wait -n app-mixer-test --for=condition=Ready pods -l app.kubernetes.io/component=data-plane --timeout=90s
          kubectl port-forward -n app-mixer-test service/app-mixer-data-plane 13002:3002 >"$RUNNER_TEMP/forward.log" 2>&1 &
          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:13002/health/ready && break || sleep 1; done
          curl -fsS http://127.0.0.1:13002/application | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(JSON.parse(s).version!==1)process.exit(1)})'
          printf '%s\n' '{"version":2,"definition":{"id":"demo","schemaVersion":1,"revision":1,"pages":[]}}' > deploy/kubernetes/data-plane/publication.json
          kubectl apply -n app-mixer-test -k deploy/kubernetes/data-plane
          kubectl rollout status -n app-mixer-test deployment/app-mixer-data-plane --timeout=180s
          kill "$FORWARD_PID" 2>/dev/null || true
          kubectl port-forward -n app-mixer-test service/app-mixer-data-plane 13003:3002 >"$RUNNER_TEMP/forward2.log" 2>&1 &
          FORWARD_PID=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:13003/health/ready && break || sleep 1; done
          curl -fsS http://127.0.0.1:13003/application | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(JSON.parse(s).version!==2)process.exit(1)})'
          POD=$(kubectl get pods -n app-mixer-test -l app.kubernetes.io/component=data-plane -o json | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const p=JSON.parse(s).items.find(x=>!x.metadata.deletionTimestamp&&x.status.phase==="Running");if(!p)process.exit(1);console.log(p.metadata.name)})')
          kubectl delete pod -n app-mixer-test "$POD" --wait=true
          kubectl rollout status -n app-mixer-test deployment/app-mixer-data-plane --timeout=180s
          kubectl wait -n app-mixer-test --for=condition=Ready pods -l app.kubernetes.io/component=data-plane --timeout=90s
          for i in $(seq 1 60); do [ "$(kubectl get deployment -n app-mixer-test app-mixer-data-plane -o jsonpath='{.status.readyReplicas}')" = 2 ] && break || sleep 1; done
          [ "$(kubectl get deployment -n app-mixer-test app-mixer-data-plane -o jsonpath='{.status.readyReplicas}')" = 2 ]
          kubectl get -n app-mixer-test deployment,service,pdb,networkpolicy
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n app-mixer-test -o wide || true
          kubectl describe pods -n app-mixer-test || true
          kubectl logs -n app-mixer-test -l app.kubernetes.io/component=data-plane --all-containers --prefix || true
