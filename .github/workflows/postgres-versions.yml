name: PostgreSQL versions
# The PostgreSQL integration suites run on the version the main CI job uses (16). Managed services offer others, so this
# runs the same files on the other supported major versions, weekly and on main.
on:
  pull_request:
    paths:
      - '.github/workflows/postgres-versions.yml'
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '29 4 * * 1'
permissions:
  contents: read
jobs:
  postgres-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '15', '17']
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg${{ matrix.postgres }}
        env:
          POSTGRES_USER: appmixer
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: appmixer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The PostgreSQL integration suites of the main CI job, on this version
        env:
          APP_MIXER_TEST_POSTGRES_URL: postgresql://appmixer:test-only-password@127.0.0.1:5432/appmixer_test
        run: |
          # Take the file list from ci.yml so the two cannot drift apart.
          files=$(grep -m1 -e 'node --test packages/core/test/postgres-jwt-revocations' .github/workflows/ci.yml | sed 's/.*node --test //')
          test -n "$files"
          psql_version=$(node -e "const pg=require('pg');const c=new pg.Client(process.env.APP_MIXER_TEST_POSTGRES_URL);c.connect().then(()=>c.query('show server_version')).then(r=>{console.log(r.rows[0].server_version);return c.end()})")
          echo "PostgreSQL $psql_version"
          case "$psql_version" in ${{ matrix.postgres }}.*) ;; *) echo "expected PostgreSQL ${{ matrix.postgres }}"; exit 1;; esac
          node --test --test-concurrency=3 $files
