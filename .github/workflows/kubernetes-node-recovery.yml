name: Kubernetes node recovery
on:
  pull_request:
    paths:
      - 'Dockerfile.data-plane'
      - '.dockerignore'
      - 'deploy/kubernetes/**'
      - 'packages/core/**'
      - 'packages/web/**'
      - 'package*.json'
      - 'tsconfig.base.json'
      - '.github/workflows/kubernetes-node-recovery.yml'
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '47 4 * * 1'
permissions:
  contents: read
jobs:
  node-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Build trusted release fixture signer
        run: npm ci && npm run build -w @app-mixer/web && npm run build -w @app-mixer/core
      - name: Install verified kind
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          echo '517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  '"$RUNNER_TEMP/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Create two-worker cluster and load Data Plane image
        run: |
          kind create cluster --name app-mixer-nodes --config deploy/kubernetes/test-support/multi-node-kind.yaml --wait 180s
          docker build -f Dockerfile.data-plane -t app-mixer-node-recovery-test:local .
          kind load docker-image app-mixer-node-recovery-test:local --name app-mixer-nodes
      - name: Render protected placement overlay
        run: kubectl kustomize deploy/kubernetes/strict-placement-example > /dev/null
      - name: Verify node failure and recovery
        run: node deploy/kubernetes/test-support/node-failure-test.mjs
      - name: Verify zone placement and recovery
        env:
          APP_MIXER_NODE_TEST_NAMESPACE: app-mixer-node-test-zone
          APP_MIXER_NODE_TEST_PLACEMENT: zone
        run: node deploy/kubernetes/test-support/node-failure-test.mjs
      - name: Verify recovery from a worker network partition
        env:
          APP_MIXER_NODE_TEST_NAMESPACE: app-mixer-node-test-partition
          APP_MIXER_NODE_TEST_PLACEMENT: zone
          APP_MIXER_NODE_TEST_FAILURE: partition
        run: node deploy/kubernetes/test-support/node-failure-test.mjs
      - name: Verify signed TLS publication during a worker partition
        env:
          APP_MIXER_NODE_TEST_NAMESPACE: app-mixer-node-test-secure
          APP_MIXER_NODE_TEST_PLACEMENT: zone
          APP_MIXER_NODE_TEST_FAILURE: partition
          APP_MIXER_NODE_TEST_SECURITY: signed
        run: node deploy/kubernetes/test-support/node-failure-test.mjs
      - name: Verify zone capacity and stalled rollout recovery
        run: node deploy/kubernetes/test-support/zone-capacity-test.mjs
      - name: Render protected zone overlay
        run: kubectl kustomize deploy/kubernetes/zone-placement-example > /dev/null
      - name: Validate protected overlay against the Kubernetes API
        run: kubectl apply --dry-run=server -n app-mixer-node-test -k deploy/kubernetes/strict-placement-example -o name
      - name: Verify strict placement admission
        run: node deploy/kubernetes/test-support/strict-placement-admission-test.mjs
      - name: Validate zone overlay with host guard
        run: kubectl apply --dry-run=server -n app-mixer-node-test -k deploy/kubernetes/zone-placement-example -o name
      - name: Verify zone placement admission
        run: node deploy/kubernetes/test-support/zone-placement-admission-test.mjs
      - name: Validate zone overlay with both placement guards
        run: kubectl apply --dry-run=server -n app-mixer-node-test-zone -k deploy/kubernetes/zone-placement-example -o name
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get all -n app-mixer-node-test -o wide || true
          kubectl describe pods -n app-mixer-node-test || true
