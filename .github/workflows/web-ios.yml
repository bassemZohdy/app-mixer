name: Web storage on iOS
on:
  pull_request:
    paths:
      - 'packages/web/**'
      - 'packages/core/src/offline-provisioning.ts'
      - '.github/workflows/web-ios.yml'
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '47 4 * * 1'
permissions:
  contents: read
jobs:
  ios-browser-storage:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Safari in an iOS Simulator
        run: node packages/web/device-test/ios-browser-storage.mjs
