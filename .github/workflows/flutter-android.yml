name: Flutter Android integration
on:
  pull_request:
    paths:
      - 'adapters/flutter/**'
      - '.github/workflows/flutter-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Flutter SDK
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/flutter.tar.xz" https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.35.5-stable.tar.xz
          echo '8eead69e5d84131fcfbb2cfd44164c00e9a04df725f24672ea234c6bd136353d  '"$RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare Android host
        run: |
          flutter create --no-pub --platforms=android --project-name adapter_device_test "$RUNNER_TEMP/adapter_device_test"
          python3 - <<'PY'
          import os
          from pathlib import Path
          host = Path(os.environ['RUNNER_TEMP']) / 'adapter_device_test'
          pubspec = host / 'pubspec.yaml'
          text = pubspec.read_text()
          package = Path(os.environ['GITHUB_WORKSPACE']) / 'adapters' / 'flutter'
          text = text.replace('dependencies:\n', f'dependencies:\n  app_mixer_flutter:\n    path: {package}\n  integration_test:\n    sdk: flutter\n', 1)
          pubspec.write_text(text)
          PY
          mkdir -p "$RUNNER_TEMP/adapter_device_test/integration_test"
          cp adapters/flutter/integration_test/renderer_device_test.dart "$RUNNER_TEMP/adapter_device_test/integration_test/"
          cd "$RUNNER_TEMP/adapter_device_test"
          flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd "$RUNNER_TEMP/adapter_device_test" && flutter test integration_test/renderer_device_test.dart
