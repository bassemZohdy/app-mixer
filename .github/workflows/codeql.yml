name: CodeQL
# Static analysis of the TypeScript sources and of the workflow files, weekly, on main and on pull requests that touch
# them. Findings appear under Security > Code scanning.
on:
  pull_request:
    paths:
      - 'packages/*/src/**'
      - '.github/codeql/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '11 5 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
