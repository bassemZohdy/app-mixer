name: React Native Android integration
on:
  pull_request:
    paths:
      - 'packages/native/**'
      - '.github/workflows/react-native-android.yml'
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build adapter and generate host
        run: |
          npm ci
          npm run build --workspace @app-mixer/native
          npx --yes @react-native-community/cli@20.0.2 init MixerDevice --version 0.83.1 --skip-install --skip-git-init --directory "$RUNNER_TEMP/MixerDevice"
          cp packages/native/device-test/App.js packages/native/device-test/signed-plan.json "$RUNNER_TEMP/MixerDevice/"
          cp packages/native/dist/index.js "$RUNNER_TEMP/MixerDevice/app-mixer.js"
          cd "$RUNNER_TEMP/MixerDevice"
          npm install --no-audit --no-fund tweetnacl@1.0.3
      - name: Build self-contained test APK
        working-directory: ${{ runner.temp }}/MixerDevice/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd "$RUNNER_TEMP/MixerDevice" && python3 "$GITHUB_WORKSPACE/packages/native/device-test/android-smoke.py"
