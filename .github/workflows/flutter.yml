name: Flutter adapter
on:
  pull_request:
    paths:
      - 'adapters/flutter/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Flutter SDK
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/flutter.tar.xz" https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.35.5-stable.tar.xz
          echo '8eead69e5d84131fcfbb2cfd44164c00e9a04df725f24672ea234c6bd136353d  '"$RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and test Flutter adapter
        working-directory: adapters/flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          timeout 180s flutter test --platform chrome test/web/renderer_web_test.dart
