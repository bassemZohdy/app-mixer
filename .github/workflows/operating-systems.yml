name: Operating systems
# The main CI job runs on Linux. The CLI, the local development server and the file-based anchors also run on developers'
# machines, and Windows and macOS differ in file locking, path handling and signals, so this runs the unit tests there,
# weekly and on main. (Linux arm64 is in arm64.yml.)
on:
  pull_request:
    paths:
      - '.github/workflows/operating-systems.yml'
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node -p "process.platform + ' ' + process.arch + ' ' + process.version"
      - run: npm test
