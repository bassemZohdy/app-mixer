name: Agent pod recovery
on:
  pull_request:
    paths:
      - 'packages/agent/**'
      - 'packages/core/**'
      - 'packages/web/**'
      - 'deploy/kubernetes/test-support/agent-recovery/**'
      - '.github/workflows/agent-pod-recovery.yml'
      - 'package*.json'
      - 'tsconfig.base.json'
      - '.dockerignore'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pod-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install verified kind
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          echo '517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  '"$RUNNER_TEMP/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Create cluster and load test image
        run: |
          kind create cluster --name agent-recovery
          docker build -f deploy/kubernetes/test-support/agent-recovery/Dockerfile -t app-mixer-agent-recovery:test .
          kind load docker-image app-mixer-agent-recovery:test --name agent-recovery
      - name: Verify recovery after deleting the worker pod
        run: |
          set -eu
          ns=agent-recovery-test
          script=deploy/kubernetes/test-support/agent-recovery/recovery.mjs
          kubectl create namespace "$ns"
          kubectl apply -n "$ns" -f deploy/kubernetes/test-support/agent-recovery/environment.yaml
          kubectl wait -n "$ns" --for=condition=Ready pod/agent-test-provider pod/agent-test-manager --timeout=120s
          kubectl exec -n "$ns" agent-test-manager -- node "$script" setup
          kubectl apply -n "$ns" -f deploy/kubernetes/test-support/agent-recovery/worker.yaml
          kubectl wait -n "$ns" --for=condition=Ready pod/agent-test-worker --timeout=120s
          observed=false
          for i in $(seq 1 60); do
            if kubectl exec -n "$ns" agent-test-manager -- node "$script" probe; then observed=true; break; fi
            sleep 1
          done
          [ "$observed" = true ]
          kubectl delete -n "$ns" pod/agent-test-worker --grace-period=5 --wait=true --timeout=90s
          kubectl delete -n "$ns" pod/agent-test-manager --grace-period=5 --wait=true --timeout=90s
          kubectl apply -n "$ns" -f deploy/kubernetes/test-support/agent-recovery/environment.yaml
          kubectl wait -n "$ns" --for=condition=Ready pod/agent-test-manager --timeout=120s
          kubectl exec -n "$ns" agent-test-manager -- node "$script" recover
      - name: Verify shared memory after terminating worker pods
        run: |
          set -eu
          ns=agent-recovery-test
          script=deploy/kubernetes/test-support/agent-recovery/postgres-memory.mjs
          kubectl apply -n "$ns" -f deploy/kubernetes/test-support/agent-recovery/postgres.yaml
          kubectl wait -n "$ns" --for=condition=Ready pod/agent-memory-postgres --timeout=180s
          ready=false
          for i in $(seq 1 60); do
            if kubectl exec -n "$ns" agent-test-manager -- node "$script" setup; then ready=true; break; fi
            sleep 1
          done
          [ "$ready" = true ]
          for phase in before after; do
            kubectl run -n "$ns" "memory-worker-$phase" --image=app-mixer-agent-recovery:test --image-pull-policy=Never --restart=Never --command -- node "$script" "$phase"
            kubectl wait -n "$ns" --for=condition=Ready "pod/memory-worker-$phase" --timeout=120s
            marker="MEMORY_$(echo "$phase" | tr '[:lower:]' '[:upper:]')_COMMIT"
            observed=false
            for i in $(seq 1 60); do
              if kubectl logs -n "$ns" "memory-worker-$phase" | grep -Fq "$marker"; then observed=true; break; fi
              sleep 1
            done
            [ "$observed" = true ]
            kubectl delete -n "$ns" "pod/memory-worker-$phase" --grace-period=0 --force --wait=true --timeout=90s
            kubectl exec -n "$ns" agent-test-manager -- node "$script" "verify-$phase"
          done
      - name: Verify HTTPS notice recovery after deleting sender and receiver pods
        run: |
          set -eu
          ns=agent-recovery-test
          script=deploy/kubernetes/test-support/agent-recovery/notice-pod.mjs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/notice-key.pem" -out "$RUNNER_TEMP/notice-cert.pem" \
            -subj '/CN=notice-receiver.agent-recovery-test.svc' \
            -addext 'subjectAltName=DNS:notice-receiver.agent-recovery-test.svc' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,digitalSignature,keyCertSign' >/dev/null 2>&1
          kubectl create secret generic notice-test-tls -n "$ns" \
            --from-file=key.pem="$RUNNER_TEMP/notice-key.pem" --from-file=cert.pem="$RUNNER_TEMP/notice-cert.pem"
          for phase in before after; do
            kubectl exec -n "$ns" agent-test-manager -- node "$script" setup "$phase"
            sed -e "s/PHASE/$phase/g" -e 's/MODE/hold/g' deploy/kubernetes/test-support/agent-recovery/notice-receiver.yaml | kubectl apply -n "$ns" -f -
            kubectl wait -n "$ns" --for=condition=Ready pod/notice-receiver --timeout=120s
            ready=false
            for i in $(seq 1 60); do
              if kubectl exec -n "$ns" notice-receiver -- node "$script" probe "$phase"; then ready=true; break; fi
              sleep 1
            done
            [ "$ready" = true ]
            sed "s/PHASE/$phase/g" deploy/kubernetes/test-support/agent-recovery/notice-sender.yaml | kubectl apply -n "$ns" -f -
            kubectl wait -n "$ns" --for=condition=Ready pod/notice-sender --timeout=120s
            marker="NOTICE_$(echo "$phase" | tr '[:lower:]' '[:upper:]')_COMMIT"
            observed=false
            for i in $(seq 1 60); do
              if kubectl logs -n "$ns" notice-receiver | grep -Fq "$marker"; then observed=true; break; fi
              sleep 1
            done
            [ "$observed" = true ]
            kubectl delete -n "$ns" pod/notice-sender pod/notice-receiver --grace-period=5 --wait=true --timeout=90s
            sed -e "s/PHASE/$phase/g" -e 's/MODE/verify/g' deploy/kubernetes/test-support/agent-recovery/notice-receiver.yaml | kubectl apply -n "$ns" -f -
            kubectl wait -n "$ns" --for=condition=Ready pod/notice-receiver --timeout=120s
            ready=false
            for i in $(seq 1 60); do
              if kubectl exec -n "$ns" notice-receiver -- node "$script" probe "$phase"; then ready=true; break; fi
              sleep 1
            done
            [ "$ready" = true ]
            kubectl exec -n "$ns" notice-receiver -- node "$script" verify "$phase"
            kubectl delete -n "$ns" pod/notice-receiver --grace-period=5 --wait=true --timeout=90s
          done
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,pvc -n agent-recovery-test -o wide || true
          kubectl describe pods -n agent-recovery-test || true
          kubectl logs -n agent-recovery-test agent-test-worker || true
          kubectl logs -n agent-recovery-test agent-test-provider || true
          kubectl logs -n agent-recovery-test agent-memory-postgres || true
          kubectl logs -n agent-recovery-test notice-sender || true
          kubectl logs -n agent-recovery-test notice-receiver || true
