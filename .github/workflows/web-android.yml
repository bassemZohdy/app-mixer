name: Web storage on Android
on:
  pull_request:
    paths:
      - 'packages/web/**'
      - 'packages/core/src/offline-provisioning.ts'
      - '.github/workflows/web-android.yml'
  workflow_dispatch:
  push:
    branches: [main, local-acceptance-hardening]
    paths:
      - 'packages/web/**'
      - '.github/workflows/web-android.yml'
  schedule:
    - cron: '41 4 * * 1'
permissions:
  contents: read
jobs:
  android-browser-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node packages/web/device-test/android-browser-storage.mjs
