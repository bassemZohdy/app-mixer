version: 2
updates:
  # npm workspaces: one grouped pull request per week for the whole repository.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns: ['@opentelemetry/*']
      langchain:
        patterns: ['@langchain/*', '@ag-ui/*']
      typescript-tooling:
        patterns: ['typescript', '@types/*']
      other-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
