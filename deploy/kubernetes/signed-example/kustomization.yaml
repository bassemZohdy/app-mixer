# The open variant with signed publication releases: releases are verified, reads stay unauthenticated over HTTP.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../open-example
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app-mixer-data-plane
      spec:
        template:
          spec:
            containers:
              - name: data-plane
                env:
                  - { name: APP_MIXER_PUBLICATION_MODE, value: signed }
                  - { name: APP_MIXER_RELEASE_ENV, value: production }
                  - { name: APP_MIXER_APPLICATION_ID, value: demo }
                  - { name: APP_MIXER_RELEASE_KEYS_PATH, value: /trust/keys.json }
                volumeMounts:
                  - { name: release-trust, mountPath: /trust, readOnly: true }
            volumes:
              - name: release-trust
                configMap: { name: app-mixer-release-keys }
