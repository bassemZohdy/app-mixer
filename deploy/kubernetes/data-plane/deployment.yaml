apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-mixer-data-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: app-mixer, app.kubernetes.io/component: data-plane}
  template:
    metadata:
      labels: {app.kubernetes.io/name: app-mixer, app.kubernetes.io/component: data-plane}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: app-mixer, app.kubernetes.io/component: data-plane}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: data-plane
          image: app-mixer-data-plane:test
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3002, protocol: TCP}]
          env:
            - {name: APP_MIXER_PUBLICATION_PATH, value: /publication/publication.json}
            - {name: APP_MIXER_PUBLICATION_MODE, value: unsigned}
            - {name: DATA_DRAIN_DELAY_MS, value: "5000"}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts: [{name: publication, mountPath: /publication, readOnly: true}]
      volumes:
        - name: publication
          configMap: {name: app-mixer-publication}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-mixer-data-plane
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: app-mixer, app.kubernetes.io/component: data-plane}
