apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-mixer-data-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: app-mixer, app.kubernetes.io/component: data-plane }
  template:
    metadata:
      labels: { app.kubernetes.io/name: app-mixer, app.kubernetes.io/component: data-plane }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: app-mixer, app.kubernetes.io/component: data-plane }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: data-plane
          # TASK-019: the base is secure by default; replace the tag (or pin a digest) with the image your registry publishes.
          image: app-mixer-data-plane:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3002, protocol: TCP }]
          env:
            - { name: APP_MIXER_PUBLICATION_PATH, value: /publication/publication.json }
            - { name: APP_MIXER_PUBLICATION_MODE, value: signed }
            - { name: APP_MIXER_RELEASE_ENV, value: production }
            - { name: APP_MIXER_APPLICATION_ID, value: demo }
            - { name: APP_MIXER_RELEASE_KEYS_PATH, value: /trust/keys.json }
            - { name: APP_MIXER_ACCESS_MODE, value: jwt }
            - { name: APP_MIXER_JWKS_PATH, value: /jwt-trust/jwks.json }
            - { name: APP_MIXER_JWT_ISSUER, value: 'https://issuer.example/' }
            - { name: APP_MIXER_JWT_AUDIENCE, value: app-mixer-data-plane }
            - { name: APP_MIXER_TENANT_ID, value: demo-tenant }
            - { name: APP_MIXER_TRANSPORT, value: tls }
            - { name: APP_MIXER_TLS_CERT_PATH, value: /tls/tls.crt }
            - { name: APP_MIXER_TLS_KEY_PATH, value: /tls/tls.key }
            - { name: APP_MIXER_REVOCATION_MODE, value: disabled }
            - { name: DATA_DRAIN_DELAY_MS, value: '5000' }
          readinessProbe:
            httpGet: { path: /health/ready, port: http, scheme: HTTPS }
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /health/live, port: http, scheme: HTTPS }
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /health/live, port: http, scheme: HTTPS }
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: '1', memory: 256Mi }
          volumeMounts:
            - { name: publication, mountPath: /publication, readOnly: true }
            - { name: release-trust, mountPath: /trust, readOnly: true }
            - { name: jwt-trust, mountPath: /jwt-trust, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: publication
          configMap: { name: app-mixer-publication }
        - name: release-trust
          configMap: { name: app-mixer-release-keys }
        - name: jwt-trust
          configMap: { name: app-mixer-jwt-keys }
        - name: tls
          secret: { secretName: app-mixer-data-plane-tls }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-mixer-data-plane
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: app-mixer, app.kubernetes.io/component: data-plane }
