apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../signed-jwt-tls-revocation-example
patches:
  - target: {group: apps, version: v1, kind: Deployment, name: app-mixer-data-plane}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: APP_MIXER_RELEASE_FLOOR_MODE, value: postgres}
