# The complete secure deployment: signed publication, JWT access and TLS, reassembled step by step from the open
# variant. Rendering this overlay yields the same settings as the secure base itself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../signed-jwt-example
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app-mixer-data-plane
      spec:
        template:
          spec:
            containers:
              - name: data-plane
                env:
                  - { name: APP_MIXER_TRANSPORT, value: tls }
                  - { name: APP_MIXER_TLS_CERT_PATH, value: /tls/tls.crt }
                  - { name: APP_MIXER_TLS_KEY_PATH, value: /tls/tls.key }
                readinessProbe:
                  httpGet: { scheme: HTTPS }
                livenessProbe:
                  httpGet: { scheme: HTTPS }
                startupProbe:
                  httpGet: { scheme: HTTPS }
                volumeMounts:
                  - { name: tls, mountPath: /tls, readOnly: true }
            volumes:
              - name: tls
                secret: { secretName: app-mixer-data-plane-tls }
