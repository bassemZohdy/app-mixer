apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-mixer-zone-placement
spec:
  policyName: app-mixer-zone-placement
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: {app-mixer.dev/enforce-zone-placement: "true"}
