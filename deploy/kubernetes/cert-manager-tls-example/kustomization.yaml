# The secure Data Plane (signed publication, JWT access, TLS) with a certificate issued and renewed by cert-manager. The
# process re-reads the Secret every 10 seconds, so a renewal needs no restart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../data-plane
  - cert-manager.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app-mixer-data-plane
      spec:
        template:
          spec:
            containers:
              - name: data-plane
                env:
                  - { name: APP_MIXER_TLS_RELOAD_MS, value: '10000' }
