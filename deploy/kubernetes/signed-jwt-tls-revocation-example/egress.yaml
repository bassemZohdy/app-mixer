apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-mixer-data-plane-revocation-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: app-mixer, app.kubernetes.io/component: data-plane}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app-mixer-revocations-db: "true"}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
