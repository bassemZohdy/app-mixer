apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../signed-jwt-tls-example
  - egress.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app-mixer-data-plane
      spec:
        template:
          spec:
            containers:
              - name: data-plane
                env:
                  - { name: APP_MIXER_REVOCATION_MODE, value: postgres }
                  - { name: APP_MIXER_REVOCATION_DSN_PATH, value: /revocation/dsn }
                  - { name: APP_MIXER_REVOCATION_CA_PATH, value: /revocation-ca/ca.pem }
                readinessProbe:
                  timeoutSeconds: 4
                volumeMounts:
                  - { name: revocation-connection, mountPath: /revocation, readOnly: true }
                  - { name: revocation-ca, mountPath: /revocation-ca, readOnly: true }
            volumes:
              - name: revocation-connection
                secret: { secretName: app-mixer-revocation-connection }
              - name: revocation-ca
                configMap: { name: app-mixer-revocation-ca }
