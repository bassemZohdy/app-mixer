apiVersion: v1
kind: Pod
metadata:
  name: agent-memory-postgres
  labels: {app: agent-memory-postgres}
spec:
  restartPolicy: Never
  containers:
    - name: postgres
      image: postgres:16
      env:
        - {name: POSTGRES_USER, value: appmixer}
        - {name: POSTGRES_PASSWORD, value: test-only-password}
        - {name: POSTGRES_DB, value: appmixer_test}
      readinessProbe:
        exec: {command: [pg_isready, -h, 127.0.0.1, -U, appmixer, -d, appmixer_test]}
        periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: agent-memory-postgres
spec:
  selector: {app: agent-memory-postgres}
  ports: [{port: 5432, targetPort: 5432}]
