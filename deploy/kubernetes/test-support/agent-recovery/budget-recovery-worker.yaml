apiVersion: v1
kind: Pod
metadata:
  name: agent-budget-recovery-worker
spec:
  restartPolicy: Never
  containers:
    - name: worker
      image: app-mixer-agent-recovery:test
      imagePullPolicy: Never
      args: [node, deploy/kubernetes/test-support/agent-recovery/budget-recovery.mjs, hold, PHASE]
      volumeMounts: [{name: state, mountPath: /data}]
  volumes:
    - name: state
      persistentVolumeClaim: {claimName: agent-recovery-test}
