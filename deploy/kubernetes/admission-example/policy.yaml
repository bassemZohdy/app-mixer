apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-mixer-data-plane-security
spec:
  failurePolicy: Fail
  paramKind: {apiVersion: v1, kind: ConfigMap}
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
  matchConditions:
    - name: data-plane-name
      expression: "object.metadata.name == 'app-mixer-data-plane'"
  variables:
    - name: c
      expression: object.spec.template.spec.containers[0]
    - name: anchor
      expression: >-
        (has(variables.c.env) && variables.c.env.exists(e, e.name == 'APP_MIXER_RELEASE_FLOOR_ANCHOR_DIR')) ? 1 : 0
  validations:
    - message: Use the approved image digest and one unmodified container.
      expression: >-
        has(params.data) && 'image' in params.data && params.data.image.matches('^.+@sha256:[a-f0-9]{64}$') &&
        object.spec.template.spec.containers.size() == 1 && variables.c.name == 'data-plane' && variables.c.image == params.data.image &&
        !has(variables.c.command) && !has(variables.c.args) && !has(variables.c.envFrom) && !has(variables.c.lifecycle) &&
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.size() == 0)
    - message: Signed release, JWT, TLS and revocation settings must match the trusted policy.
      expression: >-
        has(params.data) && has(variables.c.env) && variables.c.env.filter(e, e.name != 'APP_MIXER_JWKS_RELOAD_MS' && e.name != 'APP_MIXER_TLS_RELOAD_MS' && e.name != 'APP_MIXER_METRICS_PORT' && e.name != 'APP_MIXER_METRICS_BIND' && e.name != 'APP_MIXER_RELEASE_FLOOR_ANCHOR_DIR' && e.name != 'APP_MIXER_PUBLICATION_AUTH_TIMEOUT_MS' && e.name != 'APP_MIXER_PUBLICATION_AUTH_MAX_PENDING').size() == 18 &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_JWKS_RELOAD_MS').size() <= 1 &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_JWKS_RELOAD_MS').all(e, has(e.value) && e.value in ['10000', '30000', '60000', '300000', '900000', '3600000']) &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_TLS_RELOAD_MS').size() <= 1 &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_TLS_RELOAD_MS').all(e, has(e.value) && e.value in ['10000', '30000', '60000', '300000', '900000', '3600000']) &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_PUBLICATION_AUTH_TIMEOUT_MS').size() <= 1 &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_PUBLICATION_AUTH_TIMEOUT_MS').all(e, has(e.value) && e.value.matches('^[1-9][0-9]{0,4}$') && int(e.value) >= 100 && int(e.value) <= 30000) &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_PUBLICATION_AUTH_MAX_PENDING').size() <= 1 &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_PUBLICATION_AUTH_MAX_PENDING').all(e, has(e.value) && e.value.matches('^[1-9][0-9]{0,2}$') && int(e.value) <= 100) &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_METRICS_PORT').size() <= 1 &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_METRICS_BIND').size() <= 1 &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_METRICS_BIND').all(e, has(e.value) && e.value in ['127.0.0.1', '0.0.0.0']) &&
        (variables.c.env.filter(e, e.name == 'APP_MIXER_METRICS_BIND').size() == 0 || variables.c.env.filter(e, e.name == 'APP_MIXER_METRICS_PORT').size() == 1) &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_RELEASE_FLOOR_ANCHOR_DIR').size() <= 1 &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_RELEASE_FLOOR_ANCHOR_DIR').all(e, has(e.value) && e.value == '/floor-anchor') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_METRICS_PORT').all(e, has(e.value) && e.value != '3002' && e.value.matches('^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$')) &&
        variables.c.env.all(e, has(e.value) && !has(e.valueFrom)) &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_PUBLICATION_PATH').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_PUBLICATION_PATH' && e.value == '/publication/publication.json') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_PUBLICATION_MODE').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_PUBLICATION_MODE' && e.value == 'signed') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_ACCESS_MODE').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_ACCESS_MODE' && e.value == 'jwt') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_TRANSPORT').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_TRANSPORT' && e.value == 'tls') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_REVOCATION_MODE').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_REVOCATION_MODE' && e.value == 'postgres') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_RELEASE_FLOOR_MODE').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_RELEASE_FLOOR_MODE' && e.value == 'postgres') &&
        variables.c.env.filter(e, e.name == 'DATA_DRAIN_DELAY_MS').size() == 1 && variables.c.env.exists(e, e.name == 'DATA_DRAIN_DELAY_MS' && e.value == '5000') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_RELEASE_KEYS_PATH').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_RELEASE_KEYS_PATH' && e.value == '/trust/keys.json') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_JWKS_PATH').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_JWKS_PATH' && e.value == '/jwt-trust/jwks.json') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_TLS_CERT_PATH').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_TLS_CERT_PATH' && e.value == '/tls/tls.crt') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_TLS_KEY_PATH').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_TLS_KEY_PATH' && e.value == '/tls/tls.key') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_REVOCATION_DSN_PATH').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_REVOCATION_DSN_PATH' && e.value == '/revocation/dsn') &&
        variables.c.env.filter(e, e.name == 'APP_MIXER_REVOCATION_CA_PATH').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_REVOCATION_CA_PATH' && e.value == '/revocation-ca/ca.pem') &&
        'releaseEnvironment' in params.data && params.data.releaseEnvironment != '' && variables.c.env.filter(e, e.name == 'APP_MIXER_RELEASE_ENV').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_RELEASE_ENV' && e.value == params.data.releaseEnvironment) &&
        'applicationId' in params.data && params.data.applicationId != '' && variables.c.env.filter(e, e.name == 'APP_MIXER_APPLICATION_ID').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_APPLICATION_ID' && e.value == params.data.applicationId) &&
        'issuer' in params.data && params.data.issuer != '' && variables.c.env.filter(e, e.name == 'APP_MIXER_JWT_ISSUER').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_JWT_ISSUER' && e.value == params.data.issuer) &&
        'audience' in params.data && params.data.audience != '' && variables.c.env.filter(e, e.name == 'APP_MIXER_JWT_AUDIENCE').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_JWT_AUDIENCE' && e.value == params.data.audience) &&
        'tenantId' in params.data && params.data.tenantId != '' && variables.c.env.filter(e, e.name == 'APP_MIXER_TENANT_ID').size() == 1 && variables.c.env.exists(e, e.name == 'APP_MIXER_TENANT_ID' && e.value == params.data.tenantId)
    - message: Use the approved read-only publication, trust and credential mounts.
      expression: >-
        has(variables.c.volumeMounts) && variables.c.volumeMounts.size() == 6 + variables.anchor &&
        variables.c.volumeMounts.exists(m, m.name == 'publication' && m.mountPath == '/publication' && has(m.readOnly) && m.readOnly && !has(m.subPath) && !has(m.subPathExpr)) &&
        variables.c.volumeMounts.exists(m, m.name == 'release-trust' && m.mountPath == '/trust' && has(m.readOnly) && m.readOnly && !has(m.subPath) && !has(m.subPathExpr)) &&
        variables.c.volumeMounts.exists(m, m.name == 'jwt-trust' && m.mountPath == '/jwt-trust' && has(m.readOnly) && m.readOnly && !has(m.subPath) && !has(m.subPathExpr)) &&
        variables.c.volumeMounts.exists(m, m.name == 'tls' && m.mountPath == '/tls' && has(m.readOnly) && m.readOnly && !has(m.subPath) && !has(m.subPathExpr)) &&
        variables.c.volumeMounts.exists(m, m.name == 'revocation-connection' && m.mountPath == '/revocation' && has(m.readOnly) && m.readOnly && !has(m.subPath) && !has(m.subPathExpr)) &&
        variables.c.volumeMounts.exists(m, m.name == 'revocation-ca' && m.mountPath == '/revocation-ca' && has(m.readOnly) && m.readOnly && !has(m.subPath) && !has(m.subPathExpr)) &&
        (variables.anchor == 0 || variables.c.volumeMounts.exists(m, m.name == 'floor-anchor' && m.mountPath == '/floor-anchor' && !(has(m.readOnly) && m.readOnly) && !has(m.subPath) && !has(m.subPathExpr))) &&
        has(object.spec.template.spec.volumes) && object.spec.template.spec.volumes.size() == 6 + variables.anchor &&
        object.spec.template.spec.volumes.exists(v, v.name == 'publication' && has(v.configMap) && !has(v.configMap.items) && v.configMap.name.startsWith('app-mixer-publication-')) &&
        object.spec.template.spec.volumes.exists(v, v.name == 'release-trust' && has(v.configMap) && !has(v.configMap.items) && v.configMap.name == 'app-mixer-release-keys') &&
        object.spec.template.spec.volumes.exists(v, v.name == 'jwt-trust' && has(v.configMap) && !has(v.configMap.items) && v.configMap.name == 'app-mixer-jwt-keys') &&
        object.spec.template.spec.volumes.exists(v, v.name == 'tls' && has(v.secret) && !has(v.secret.items) && v.secret.secretName == 'app-mixer-data-plane-tls') &&
        object.spec.template.spec.volumes.exists(v, v.name == 'revocation-connection' && has(v.secret) && !has(v.secret.items) && v.secret.secretName == 'app-mixer-revocation-connection') &&
        object.spec.template.spec.volumes.exists(v, v.name == 'revocation-ca' && has(v.configMap) && !has(v.configMap.items) && v.configMap.name == 'app-mixer-revocation-ca') &&
        (variables.anchor == 0 || object.spec.template.spec.volumes.exists(v, v.name == 'floor-anchor' && has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'app-mixer-floor-anchor' && !(has(v.persistentVolumeClaim.readOnly) && v.persistentVolumeClaim.readOnly)))
    - message: Data Plane pod security and selector labels must remain enabled.
      expression: >-
        has(object.spec.template.metadata.labels) &&
        'app.kubernetes.io/name' in object.spec.template.metadata.labels && object.spec.template.metadata.labels['app.kubernetes.io/name'] == 'app-mixer' &&
        'app.kubernetes.io/component' in object.spec.template.metadata.labels && object.spec.template.metadata.labels['app.kubernetes.io/component'] == 'data-plane' &&
        has(object.spec.template.spec.automountServiceAccountToken) && !object.spec.template.spec.automountServiceAccountToken &&
        (!has(object.spec.template.spec.hostNetwork) || !object.spec.template.spec.hostNetwork) &&
        (!has(object.spec.template.spec.hostPID) || !object.spec.template.spec.hostPID) &&
        (!has(object.spec.template.spec.hostIPC) || !object.spec.template.spec.hostIPC) &&
        (!has(object.spec.template.spec.hostAliases) || object.spec.template.spec.hostAliases.size() == 0) && !has(object.spec.template.spec.dnsConfig) &&
        has(object.spec.template.spec.securityContext) && has(object.spec.template.spec.securityContext.runAsNonRoot) && object.spec.template.spec.securityContext.runAsNonRoot &&
        has(object.spec.template.spec.securityContext.runAsUser) && object.spec.template.spec.securityContext.runAsUser == 1000 &&
        has(object.spec.template.spec.securityContext.runAsGroup) && object.spec.template.spec.securityContext.runAsGroup == 1000 &&
        has(object.spec.template.spec.securityContext.seccompProfile) && object.spec.template.spec.securityContext.seccompProfile.type == 'RuntimeDefault' &&
        has(variables.c.securityContext) && has(variables.c.securityContext.allowPrivilegeEscalation) && !variables.c.securityContext.allowPrivilegeEscalation &&
        has(variables.c.securityContext.readOnlyRootFilesystem) && variables.c.securityContext.readOnlyRootFilesystem &&
        (!has(variables.c.securityContext.privileged) || !variables.c.securityContext.privileged) &&
        (!has(variables.c.securityContext.runAsUser) || variables.c.securityContext.runAsUser == 1000) &&
        (!has(variables.c.securityContext.runAsGroup) || variables.c.securityContext.runAsGroup == 1000) &&
        (!has(variables.c.securityContext.runAsNonRoot) || variables.c.securityContext.runAsNonRoot) &&
        (!has(variables.c.securityContext.seccompProfile) || variables.c.securityContext.seccompProfile.type == 'RuntimeDefault') &&
        (!has(variables.c.securityContext.procMount) || variables.c.securityContext.procMount == 'Default') &&
        has(variables.c.securityContext.capabilities) && has(variables.c.securityContext.capabilities.drop) && 'ALL' in variables.c.securityContext.capabilities.drop &&
        (!has(variables.c.securityContext.capabilities.add) || variables.c.securityContext.capabilities.add.size() == 0)
    - message: Keep at least two replicas, an active bounded rollout and the approved shutdown grace period.
      expression: >-
        has(object.spec.replicas) && object.spec.replicas >= 2 &&
        (!has(object.spec.paused) || !object.spec.paused) &&
        (!has(object.spec.minReadySeconds) || object.spec.minReadySeconds <= 60) &&
        (!has(object.spec.progressDeadlineSeconds) || (object.spec.progressDeadlineSeconds >= 60 && object.spec.progressDeadlineSeconds <= 1800)) &&
        has(object.spec.strategy) && object.spec.strategy.type == 'RollingUpdate' &&
        has(object.spec.strategy.rollingUpdate) && object.spec.strategy.rollingUpdate.maxUnavailable == 0 &&
        object.spec.strategy.rollingUpdate.maxSurge == 1 &&
        has(object.spec.template.spec.terminationGracePeriodSeconds) && object.spec.template.spec.terminationGracePeriodSeconds >= 10
    - message: The Data Plane must expose only its approved listener port.
      expression: >-
        has(variables.c.ports) && variables.c.ports.size() == 1 &&
        variables.c.ports[0].name == 'http' && variables.c.ports[0].containerPort == 3002 &&
        (!has(variables.c.ports[0].protocol) || variables.c.ports[0].protocol == 'TCP') &&
        (!has(variables.c.ports[0].hostPort) || variables.c.ports[0].hostPort == 0) &&
        (!has(variables.c.ports[0].hostIP) || variables.c.ports[0].hostIP == '')
    - message: Bound health-probe timing and preserve the shutdown grace period.
      expression: >-
        has(variables.c.readinessProbe) && has(variables.c.readinessProbe.periodSeconds) && variables.c.readinessProbe.periodSeconds <= 5 &&
        has(variables.c.readinessProbe.timeoutSeconds) && variables.c.readinessProbe.timeoutSeconds <= 5 &&
        has(variables.c.readinessProbe.failureThreshold) && variables.c.readinessProbe.failureThreshold <= 2 &&
        has(variables.c.readinessProbe.successThreshold) && variables.c.readinessProbe.successThreshold == 1 &&
        (!has(variables.c.readinessProbe.initialDelaySeconds) || variables.c.readinessProbe.initialDelaySeconds <= 5) &&
        !has(variables.c.readinessProbe.terminationGracePeriodSeconds) &&
        has(variables.c.livenessProbe) && has(variables.c.livenessProbe.periodSeconds) && variables.c.livenessProbe.periodSeconds <= 30 &&
        has(variables.c.livenessProbe.timeoutSeconds) && variables.c.livenessProbe.timeoutSeconds <= 5 &&
        has(variables.c.livenessProbe.failureThreshold) && variables.c.livenessProbe.failureThreshold <= 6 &&
        has(variables.c.livenessProbe.successThreshold) && variables.c.livenessProbe.successThreshold == 1 &&
        (!has(variables.c.livenessProbe.initialDelaySeconds) || variables.c.livenessProbe.initialDelaySeconds <= 30) &&
        (!has(variables.c.livenessProbe.terminationGracePeriodSeconds) || variables.c.livenessProbe.terminationGracePeriodSeconds >= 10) &&
        has(variables.c.startupProbe) && has(variables.c.startupProbe.periodSeconds) && variables.c.startupProbe.periodSeconds <= 10 &&
        has(variables.c.startupProbe.timeoutSeconds) && variables.c.startupProbe.timeoutSeconds <= 5 &&
        has(variables.c.startupProbe.failureThreshold) && variables.c.startupProbe.failureThreshold <= 60 &&
        variables.c.startupProbe.periodSeconds * variables.c.startupProbe.failureThreshold <= 300 &&
        has(variables.c.startupProbe.successThreshold) && variables.c.startupProbe.successThreshold == 1 &&
        (!has(variables.c.startupProbe.initialDelaySeconds) || variables.c.startupProbe.initialDelaySeconds <= 30) &&
        (!has(variables.c.startupProbe.terminationGracePeriodSeconds) || variables.c.startupProbe.terminationGracePeriodSeconds >= 10)
    - message: HTTPS health probes must target the approved local listener and paths.
      expression: >-
        has(variables.c.readinessProbe) && has(variables.c.readinessProbe.httpGet) && variables.c.readinessProbe.httpGet.path == '/health/ready' && variables.c.readinessProbe.httpGet.scheme == 'HTTPS' && variables.c.readinessProbe.httpGet.port == 'http' && (!has(variables.c.readinessProbe.httpGet.host) || variables.c.readinessProbe.httpGet.host == '') && (!has(variables.c.readinessProbe.httpGet.httpHeaders) || variables.c.readinessProbe.httpGet.httpHeaders.size() == 0) &&
        has(variables.c.livenessProbe) && has(variables.c.livenessProbe.httpGet) && variables.c.livenessProbe.httpGet.path == '/health/live' && variables.c.livenessProbe.httpGet.scheme == 'HTTPS' && variables.c.livenessProbe.httpGet.port == 'http' && (!has(variables.c.livenessProbe.httpGet.host) || variables.c.livenessProbe.httpGet.host == '') && (!has(variables.c.livenessProbe.httpGet.httpHeaders) || variables.c.livenessProbe.httpGet.httpHeaders.size() == 0) &&
        has(variables.c.startupProbe) && has(variables.c.startupProbe.httpGet) && variables.c.startupProbe.httpGet.path == '/health/live' && variables.c.startupProbe.httpGet.scheme == 'HTTPS' && variables.c.startupProbe.httpGet.port == 'http' && (!has(variables.c.startupProbe.httpGet.host) || variables.c.startupProbe.httpGet.host == '') && (!has(variables.c.startupProbe.httpGet.httpHeaders) || variables.c.startupProbe.httpGet.httpHeaders.size() == 0)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-mixer-data-plane-scale
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [deployments/scale]
  matchConditions:
    - name: data-plane-name
      expression: "object.metadata.name == 'app-mixer-data-plane'"
  validations:
    - message: Keep at least two Data Plane replicas when scaling.
      expression: "object.spec.replicas >= 2"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-mixer-data-plane-disruption-budget
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [policy]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [poddisruptionbudgets]
  matchConditions:
    - name: data-plane-name
      expression: "request.operation == 'DELETE' ? oldObject.metadata.name == 'app-mixer-data-plane' : object.metadata.name == 'app-mixer-data-plane'"
  validations:
    - message: Preserve the Data Plane disruption budget and its exact selector.
      expression: >-
        request.operation != 'DELETE' && has(object.spec) && has(object.spec.minAvailable) && object.spec.minAvailable == 1 &&
        !has(object.spec.maxUnavailable) && has(object.spec.selector) && has(object.spec.selector.matchLabels) &&
        object.spec.selector.matchLabels.size() == 2 &&
        'app.kubernetes.io/name' in object.spec.selector.matchLabels && object.spec.selector.matchLabels['app.kubernetes.io/name'] == 'app-mixer' &&
        'app.kubernetes.io/component' in object.spec.selector.matchLabels && object.spec.selector.matchLabels['app.kubernetes.io/component'] == 'data-plane' &&
        (!has(object.spec.selector.matchExpressions) || object.spec.selector.matchExpressions.size() == 0)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-mixer-data-plane-deletion
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [DELETE]
        resources: [deployments]
  matchConditions:
    - name: data-plane-name
      expression: "oldObject.metadata.name == 'app-mixer-data-plane'"
  validations:
    - message: Preserve the Data Plane Deployment while the guard is enforced.
      expression: "false"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-mixer-data-plane-service
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [services]
  matchConditions:
    - name: data-plane-name
      expression: "request.operation == 'DELETE' ? oldObject.metadata.name == 'app-mixer-data-plane' : object.metadata.name == 'app-mixer-data-plane'"
  validations:
    - message: Preserve the internal Data Plane Service, selector and listener.
      expression: >-
        request.operation != 'DELETE' && has(object.spec) && object.spec.type == 'ClusterIP' &&
        (!has(object.spec.clusterIP) || object.spec.clusterIP != 'None') &&
        (!has(object.spec.externalIPs) || object.spec.externalIPs.size() == 0) &&
        (!has(object.spec.externalName) || object.spec.externalName == '') &&
        (!has(object.spec.internalTrafficPolicy) || object.spec.internalTrafficPolicy == 'Cluster') &&
        (!has(object.spec.publishNotReadyAddresses) || !object.spec.publishNotReadyAddresses) &&
        has(object.spec.selector) && object.spec.selector.size() == 2 &&
        'app.kubernetes.io/name' in object.spec.selector && object.spec.selector['app.kubernetes.io/name'] == 'app-mixer' &&
        'app.kubernetes.io/component' in object.spec.selector && object.spec.selector['app.kubernetes.io/component'] == 'data-plane' &&
        has(object.spec.ports) && object.spec.ports.size() == 1 &&
        object.spec.ports[0].name == 'http' && object.spec.ports[0].port == 3002 &&
        object.spec.ports[0].targetPort == 'http' &&
        (!has(object.spec.ports[0].protocol) || object.spec.ports[0].protocol == 'TCP') &&
        (!has(object.spec.ports[0].nodePort) || object.spec.ports[0].nodePort == 0)
