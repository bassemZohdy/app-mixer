apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-mixer-data-plane-security
spec:
  policyName: app-mixer-data-plane-security
  validationActions: [Deny]
  paramRef:
    name: app-mixer-security-policy
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels: {app-mixer.dev/enforce-data-plane: "true"}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
